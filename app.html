    /* ─── Splash screen ─── */
@keyframes splashFadeIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes splashFadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes splashLogoIn {
  from { opacity: 0; transform: scale(0.82); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes splashTextIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes splashLoader {
  from { transform: translateX(-110%); }
  to   { transform: translateX(420%); }
}

.splash-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 42%, #10162b 0%, #070b14 70%);
  animation: splashFadeIn 0.4s ease-out;
}
.splash-overlay.leaving {
  animation: splashFadeOut 0.65s ease-in forwards;
  pointer-events: none;
}
.splash-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 6vh;
}
.splash-logo {
  animation: splashLogoIn 0.9s 0.15s cubic-bezier(0.22, 0.9, 0.3, 1) both;
  filter: drop-shadow(0 0 26px rgba(34, 211, 238, 0.25));
}
.splash-welcome {
  margin-top: 26px;
  color: #94a3b8;
  font-size: 12px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  animation: splashTextIn 0.7s 0.7s ease-out both;
}
.splash-title {
  margin-top: 8px;
  color: #f8fafc;
  font-size: 30px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-shadow: 0 0 24px rgba(103, 232, 249, 0.35);
  animation: splashTextIn 0.7s 1s ease-out both;
}
.splash-tagline {
  margin-top: 10px;
  color: #67e8f9aa;
  font-size: 12.5px;
  font-weight: 300;
  font-style: italic;
  letter-spacing: 0.08em;
  animation: splashTextIn 0.7s 1.3s ease-out both;
}
.splash-loader {
  margin-top: 34px;
  width: 120px;
  height: 2px;
  border-radius: 2px;
  background: rgba(148, 163, 184, 0.15);
  overflow: hidden;
  animation: splashTextIn 0.6s 1.5s ease-out both;
}
.splash-loader span {
  display: block;
  width: 34%;
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, #22d3ee, transparent);
  animation: splashLoader 1.4s ease-in-out infinite;
}

/* ─── Vagues du logo : relais alterné gauche ↔ droite ─── */
.af-wave {
  stroke-dasharray: 70 200;  /* 70 d'impulsion, 200 de silence = 1 seule impulsion visible */
  stroke-dashoffset: 70;     /* impulsion rangée avant le début du tracé = invisible */
}
.af-wave-a { animation: afSweepLR 4.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
.af-wave-b {
  animation: afSweepRL 4.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
  animation-delay: -2.2s;    /* démarre à mi-cycle : prend le relais de l'autre */
}
@keyframes afSweepLR {        /* gauche → droite */
  0%   { stroke-dashoffset: 70; }
  50%  { stroke-dashoffset: -200; }  /* sortie à droite, disparaît */
  100% { stroke-dashoffset: -200; }  /* reste invisible jusqu'au prochain tour */
}
@keyframes afSweepRL {        /* droite → gauche */
  0%   { stroke-dashoffset: -200; }
 50%  { stroke-dashoffset: 70; }
  100% { stroke-dashoffset: 70; }
}

@media (prefers-reduced-motion: reduce) {
  .splash-overlay * { animation-duration: 0.01s !important; animation-delay: 0s !important; }
}

  <script type="text/babel">
// ─── Récupération des hooks React ───
    const { useState, useEffect, useRef, useMemo } = React;

    const DEFINITIONS = {
      vfc: {
        title: "VFC — Variabilité de la Fréquence Cardiaque",
        text: "Variation des intervalles entre deux battements. Une VFC élevée signale un système nerveux souple, capable de passer du stress au calme. La cohérence cardiaque est l’un des moyens les plus simples de l’entraîner.",

      bpm: {
        title: "bpm — battements par minute",

      tonique: {

        title: "Activation 3–3",

      },
      soupir: {

      },

        text: "Cycles courts inspirés du kapalabhati. L’expire est active, l’inspire revient seule. Contre-indiqué grossesse, hypertension, vertige.",
      },
      soirhold: {
        title: "Rétention du soir",
        text: "Courte pause poumons pleins, puis expire double. On descend d’un cran avant le coucher.",
      },
      "478plus": {

        text: "Même ratio que le 4-7-8, davantage de cycles. Baisser le bpm. Version allongée, lumières basses.",
      },
      repas: {
        title: "Souffle du repas",
        text: "Respiration basse après table. On donne de la place à la digestion au lieu de la comprimer.",
      },
      vague: {

        text: "Inspire, petite pause, expire plus longue. Le diaphragme masse le centre. Éviter juste après un repas très copieux.",
      },
      agni: {

    function formatRatio(ratio) {
      if (!ratio) return "";
      const parts = [ratio.inspire];
      if (ratio.hold) parts.push(ratio.hold);
      parts.push(ratio.expire);
      if (ratio.holdEmpty) parts.push(ratio.holdEmpty);
      return parts.join("–");
    }

    function ratioDefinition(label) {
      return {
        title: `Ratio ${label}`,
        text: "Chaque chiffre est un nombre de temps du métronome, pas des secondes fixes. L’ordre habituel : inspire — rétention poumons pleins — expire — pause poumons vides. Le tempo (bpm) décide de la durée réelle de chaque compte.",
      };
    }

    // ─── Audio : cloche tibétaine (métronome_2) ───
    function ensureAudio(audioCtxRef) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!audioCtxRef.current) audioCtxRef.current = new AC();
        return audioCtxRef.current;
      } catch (e) {
        return null;
      }
    }

   function toneForPhase(phase, toneMode) {
  if (toneMode !== "mix") return toneMode || "standard";
  if (phase === "inspire") return "aigue";
  if (phase === "hold") return "standard";
  if (phase === "expire") return "grave";
  if (phase === "holdEmpty") return "vide";
  return "grave";
}

function playBell(ctx, time, tone, volume) {
  try {
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc1.connect(gainNode);
    osc2.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc1.type = "sine";
    osc2.type = "sine";
    let freq1 = 880, freq2 = 1320;
    if (tone === "grave") { freq1 = 392; freq2 = 588; }
    else if (tone === "aigue") { freq1 = 1174; freq2 = 1760; }
    else if (tone === "vide") { freq1 = 262; freq2 = 392; }
    const dur = 0.55;
    osc1.frequency.setValueAtTime(freq1, time);
    osc2.frequency.setValueAtTime(freq2, time);
    gainNode.gain.setValueAtTime(0, time);
    gainNode.gain.linearRampToValueAtTime(volume, time + 0.004);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc1.start(time); osc1.stop(time + dur);
    osc2.start(time); osc2.stop(time + dur);
  } catch (e) {}
}

    function Term({ defKey, ratioLabel, children }) {
      const [open, setOpen] = useState(false);
      const wrapRef = useRef(null);
      const def =
        defKey === "ratio"
          ? ratioDefinition(ratioLabel || children)
          : DEFINITIONS[defKey];

      useEffect(() => {
        if (!open) return;
        const close = (e) => {
          if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
        };
        document.addEventListener("click", close);
        return () => document.removeEventListener("click", close);
      }, [open]);

      if (!def) return <>{children}</>;

      return (
        <span
          ref={wrapRef}
          className="relative inline"
          onClick={(e) => {
            e.stopPropagation();
            e.preventDefault();
            setOpen((v) => !v);
          }}
        >
          <span className="term-mark">{children}</span>
          {open && (
            <span className="term-pop" role="tooltip">
              <strong>{def.title}</strong>
              {def.text}
            </span>
          )}
        </span>
      );
    }

    // Géométrie du logo : cercle ouvert gauche/droite + deux ondes
    const MARK = {
      ringTop: "M 14.75 44 A 48 48 0 0 1 105.25 44",
      ringBot: "M 105.25 76 A 48 48 0 0 1 14.75 76",
      wave1: "M 8 57 C 22 42, 38 42, 54 56 C 70 70, 86 70, 106 55",
      wave2: "M 8 70 C 22 55, 38 55, 54 69 C 70 83, 86 83, 106 68",
    };

   function LogoMark({ color = "#67e8f9", glowColor = "#22d3ee", size = 28, animated = false }) {
  return (
    <svg width={size} height={size} viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <defs>
        <filter id="logoHalo" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.5" />
        </filter>
      </defs>
      <g filter="url(#logoHalo)" stroke={glowColor} strokeWidth="8" strokeLinecap="round" fill="none" opacity="0.4">
        <path d={MARK.ringTop} />
        <path d={MARK.ringBot} />
      </g>
      <g stroke={color} strokeWidth="6.5" strokeLinecap="round" fill="none">
        <path d={MARK.ringTop} />
        <path d={MARK.ringBot} />
      </g>
      {animated && ( /* traces fantômes : la "piste" des impulsions */
        <g fill="none" strokeLinecap="round">
          <path d={MARK.wave1} stroke="#7deaf5" strokeWidth="5.5" opacity="0.18" />
          <path d={MARK.wave2} stroke="#5bd4e8" strokeWidth="5.5" opacity="0.18" />
        </g>
      )}
      <path d={MARK.wave1} stroke="#7deaf5" strokeWidth="5.5" strokeLinecap="round" fill="none"
        className={animated ? "af-wave af-wave-a" : undefined} />
      <path d={MARK.wave2} stroke="#5bd4e8" strokeWidth="5.5" strokeLinecap="round" fill="none"
        className={animated ? "af-wave af-wave-b" : undefined} />
    </svg>
  );
}
    

    // ═══════════════════════════════════════════════════════════════════
    // DONNÉES — 10 exercices (ratio, intensité, tags)
    // ═══════════════════════════════════════════════════════════════════
    let EXERCISES = [];

    async function loadExercises() {
      const v = "20260912i";
      const byId = new Map();
      async function absorb(url) {
        try {
          const r = await fetch(url);
          if (!r.ok) return;
          const data = await r.json();
          const rows = Array.isArray(data) ? data : data.exercises || [data];
          rows.forEach((ex) => {
            if (ex && ex.id) byId.set(ex.id, ex);
          });
        } catch (e) {}
      }
      await absorb("exercises.json?v=" + v);
      await absorb("exercises-a.json?v=" + v);
      await absorb("exercises-b.json?v=" + v);
      try {
        const man = await fetch("exercises/manifest.json?v=" + v);
        if (man.ok) {
          const { ids } = await man.json();
          for (const id of ids || []) {
            if (!byId.has(id)) await absorb("exercises/" + id + ".json?v=" + v);
          }
        }
      } catch (e) {}
      EXERCISES = Array.from(byId.values());
      if (!EXERCISES.length) throw new Error("catalogue vide");
    }

    const INTENTION_DEFS = {
      calme: { id: "calme", label: "Calme", tags: ["#Calme", "#Anxiété", "#Reset", "#Équilibre"] },
      energie: { id: "energie", label: "Énergie", tags: ["#Énergie", "#Fatigue", "#Sport"] },
      focus: { id: "focus", label: "Focus", tags: ["#Focus", "#Concentration", "#Performance"] },
      sommeil: { id: "sommeil", label: "Sommeil", tags: ["#Sommeil", "#Soir"] },
      reveil: { id: "reveil", label: "Réveil", tags: ["#Réveil", "#Matin"] },
      digestion: { id: "digestion", label: "Digestion", tags: ["#Digestion"] },
      exo: { id: "exo", label: "Exo du jour", tags: ["#ExoDuJour"] },
    };

    const LEVEL_RANK = { Débutant: 0, Intermédiaire: 1, Avancé: 2 };

    function parisHour() {
      const raw = new Date().toLocaleString("fr-FR", {
        timeZone: "Europe/Paris",
        hour: "numeric",
        hour12: false,
      });
      const h = parseInt(raw, 10);
      return Number.isFinite(h) ? h : new Date().getHours();
    }

    function fourthIntentionId() {
      const h = parisHour();
      if (h < 5) return "sommeil";
      if (h < 8) return "reveil";
      if (h < 12) return "exo";
      if (h < 15) return "digestion";
      if (h < 20) return "exo";
      if (h < 22) return "digestion";
      return "sommeil";
    }

    function visibleIntentions() {
      return [
        INTENTION_DEFS.calme,
        INTENTION_DEFS.energie,
        INTENTION_DEFS.focus,
        INTENTION_DEFS[fourthIntentionId()],
      ];
    }

    function greetingLine() {
      const h = parisHour();
      if (h >= 5 && h < 12) return "Bonjour";
      if (h >= 12 && h < 18) return "Bon après-midi";
      if (h >= 18 && h < 22) return "Bonsoir";
      return "Cette nuit";
    }

    // ─── Styles des phases ───
    const PHASE_STYLE = {
      inspire: { accent: "#38bdf8", label: "INSPIRE", bg: "from-sky-950 to-sky-900" },
      hold: { accent: "#a78bfa", label: "RETIENS", bg: "from-violet-950 to-violet-900" },
      expire: { accent: "#2dd4bf", label: "EXPIRE", bg: "from-teal-950 to-teal-900" },
      holdEmpty: { accent: "#94a3b8", label: "PAUSE", bg: "from-slate-950 to-slate-900" },
      prep: { accent: "#64748b", label: "", bg: "from-slate-950 to-slate-900" },
    };

    // ─── Utilitaires de persistance ───
    const store = {
      get: (k, fb = null) => {
        try {
          const r = localStorage.getItem(k);
          return r ? JSON.parse(r) : fb;
        } catch {
          return fb;
        }
      },
      set: (k, v) => {
        try {
          localStorage.setItem(k, JSON.stringify(v));
        } catch {}
      },
    };

    function getTodayKey() {
      return new Date().toLocaleDateString("en-CA", { timeZone: "Europe/Paris" });
    }

    function updateStreak() {
      const s = store.get("af_streak", { count: 0, lastDate: null });
      const today = getTodayKey();
      const y = new Date();
      y.setDate(y.getDate() - 1);
      const yesterday = y.toLocaleDateString("en-CA", { timeZone: "Europe/Paris" });
      if (s.lastDate === today) return s;
      const updated = {
        count: s.lastDate === yesterday ? s.count + 1 : 1,
        lastDate: today,
      };
      store.set("af_streak", updated);
      return updated;
    }

    function logSession(exId, name) {
      const logs = store.get("af_journal", []);
      logs.unshift({
        id: Date.now(),
        exerciseId: exId,
        name,
        date: getTodayKey(),
        time: new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }),
      });
      store.set("af_journal", logs.slice(0, 100));
    }

    function buildSequence(ex) {
      const seq = [];
      const { ratio, cycles, instructions, intensity } = ex;
      const phases = ["inspire", "hold", "expire", "holdEmpty"].filter(
        (p) => ratio[p] > 0
      );
      for (let c = 1; c <= cycles; c++) {
        phases.forEach((phase) => {
          seq.push({
            phase,
            duration: ratio[phase],
            cycle: c,
            totalCycles: cycles,
            instruction: instructions[phase] || "",
            intensity: intensity[phase] || "douce",
          });
        });
      }
      return seq;
    }
    
    function Splash({ onDone, duration = 3000 }) {
  const rootRef = useRef(null);
  const doneRef = useRef(false);

  useEffect(() => {
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const show = reduced ? 500 : duration;
    const fade = reduced ? 0 : 700;
    const t1 = setTimeout(() => {
      if (rootRef.current) rootRef.current.classList.add("leaving");
    }, show);
    const t2 = setTimeout(() => {
      if (!doneRef.current) { doneRef.current = true; onDone(); }
    }, show + fade);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []); // eslint-disable-line

  return (
    <div className="splash-overlay" ref={rootRef} role="status" aria-label="Chargement d’Air Fitness">
      <div className="splash-inner">
        <div className="splash-logo">
          <LogoMark size={128} animated />
        </div>
        <p className="splash-welcome">Bienvenue sur</p>
        <h1 className="splash-title">Air Fitness</h1>
        <p className="splash-tagline">l’application souffle &amp; bien-être</p>
        <div className="splash-loader"><span /></div>
      </div>
    </div>
  );
}

                className="w-full py-4 rounded-2xl text-white font-semibold text-[15px]"
                style={{
                  background: "linear-gradient(135deg, #0ea5e9, #0284c7)",
                  boxShadow: "0 8px 28px #0ea5e935",
                }}
              >
                Retour à l’accueil
              </button>
              <button
                onClick={() => openExercise(activeEx)}
                className="w-full py-3 rounded-2xl text-sky-400/90 text-sm font-medium"
                style={{ border: "1px solid #0ea5e925" }}
              >
                Refaire cet exercice
              </button>
            </div>
          </div>
        );
      }

      // ─── Écran Journal ───
      if (tab === "journal") {
        return (
          <div
            className="min-h-screen bg-[#070b14] flex flex-col"
            style={{ fontFamily: "system-ui, -apple-system, sans-serif" }}
          >
            <div className="px-5 pt-12 pb-4">
              <h1 className="text-xl font-semibold text-white">Journal</h1>
              <p className="text-slate-500 text-xs mt-1">
                Historique de tes sessions de souffle
              </p>
            </div>

            <div className="flex-1 overflow-y-auto px-5 pb-28">
              {journal.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-20 text-center gap-3">
                  <span className="text-4xl opacity-40">📓</span>
                  <p className="text-slate-400 text-sm">Aucune session encore</p>
                  <p className="text-slate-600 text-xs max-w-[220px]">
                    Termine un exercice pour commencer à remplir ton journal
                  </p>
                </div>
              ) : (
                <div className="flex flex-col gap-2.5">
                  {journal.map((entry) => (
                    <div
                      key={entry.id}
                      className="rounded-2xl px-4 py-3.5 flex items-center justify-between"
                      style={{
                        background: "#0f1524",
                        border: "1px solid #1a2236",
                      }}
                    >
                      <div>
                        <p className="text-white text-sm font-medium">
                          {entry.name}
                        </p>
                        <p className="text-slate-500 text-xs mt-0.5">
                          {entry.date} · {entry.time}
                        </p>
                      </div>
                      <span className="text-slate-600 text-lg">✓</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <BottomNav tab={tab} setTab={setTab} />
          </div>
        );
      }

      // ─── Écran d'accueil ───
      return (
        <div
          className="h-full max-h-full flex flex-col overflow-hidden bg-[#070b14]"
          style={{ fontFamily: "system-ui, -apple-system, sans-serif" }}
        >
          {/* Header fixe, HORS du conteneur scrollable */}
          <a href="index.html"><div className="px-5 pt-5 pb-1 flex items-center justify-evenly">
            <h1 className="text-[18px] font-semibold text-white tracking-normal">
              Air Fitness
            </h1>
            <span className="text-slate-400 text-lg px-7">
            Souffle & Bien-être</span>
              <img
              src="favicon-48x48.png"
              alt="Logo Air Fitness"
              width="36"
              height="36"
              className="header-logo"
            />
          </div>
          </a>


          {/* Contenu scrollable */}
          <div className="flex-1 min-h-0 overflow-y-auto pb-28">
            {/* Super-filtres d’intention */}
            <div className="px-5 mt-4">
              <div className="border-l-2 border-dotted border-[#E53935] pl-3.5">
                <p className="text-slate-400 text-[14px] mb-1.5">
                  ❓
                </p>
                <div className="intent-row">
                  {visibleIntentions().map((item) => {
                    const active = intention === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => toggleIntention(item.id)}
                        className="super-tag"
                        style={superChipStyle(active)}
                      >
                        {item.label}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* Carte Streak */}
            <div
              className="mx-5 mt-5 rounded-3xl p-5"
              style={{
                background: "linear-gradient(145deg, #12182b, #1a1435)",
                border: "1px solid #2e2a55",
              }}
            >
              <div className="flex items-center justify-between mb-3">
                <div>
                  <p className="text-indigo-400/80 text-[11px] uppercase tracking-[0.15em] font-medium mb-1">
                    Série en cours
                  </p>
                  <div className="flex items-end gap-1.5">
                    <span className="text-3xl font-semibold text-white">
                      {streak.count}
                    </span>
                    <span className="text-indigo-300/70 text-sm mb-0.5">
                      jour{streak.count > 1 ? "s" : ""}
                    </span>
                  </div>
                </div>
                <span className="text-3xl">
                  {streak.count >= 7 ? "🔥" : streak.count >= 3 ? "⚡" : streak.count >= 1 ? "✨" : "💤"}
                </span>
              </div>
              <div className="flex gap-1.5 mb-2.5">
                {Array.from({ length: 7 }).map((_, i) => (
                  <div
                    key={i}
                    className="flex-1 h-1 rounded-full transition-all"
                    style={{
                      background:
                        i < Math.min(streak.count, 7) ? "#818cf8" : "#2a2550",
                    }}
                  />
                ))}
              </div>
              <p className="text-indigo-400/60 text-xs">
                {doneToday
                  ? "Session réalisée aujourd’hui"
                  : "Fais une session pour prolonger ta série"}
              </p>
            </div>

            {/* Filtres escamotables */}
            <div className="px-5 mt-6">
              <div className={filtersOpen ? "filter-line open" : "filter-line"}>
                <span className="text-slate-500 text-[11px] uppercase tracking-[0.15em] font-medium flex-shrink-0">
                  Filtres
                </span>
                {(filtersOpen ? allTags : closedFilterTags).map((tag) => {
                  const active = tagIsActive(tag);
                  const label = tag === "#ExoDuJour" ? "Exo du jour" : tag;
                  return (
                    <button
                      key={tag}
                      onClick={() => toggleTag(tag)}
                      className="filter-tag flex-shrink-0"
                      style={filterChipStyle(active)}
                    >
                      {label}
                    </button>
                  );
                })}
                {filtersOpen ? (
                  <button
                    onClick={() => setFiltersOpen(false)}
                    className="filter-tag flex-shrink-0"
                    style={filterChipStyle(false)}
                  >
                    ---
                  </button>
                ) : (
                  <button
                    onClick={() => setFiltersOpen(true)}
                    className="filter-tag flex-shrink-0"
                    style={filterChipStyle(false)}
                  >
                    +++
                  </button>
                )}
              </div>
            </div>

            {/* Liste exercices */}
            <div className="px-5 mt-6">
              <div className="flex items-center justify-between mb-2.5">
                <p className="text-slate-500 text-[11px] uppercase tracking-[0.15em] font-medium">
                  {intention || selectedTags.length > 0
                    ? `${filteredExercises.length} exercice${filteredExercises.length > 1 ? "s" : ""}`
                    : showCatalog
                    ? "Catalogue"
                    : "Suggestions"}
                </p>
                {!intention && selectedTags.length === 0 && (
                  <button
                    onClick={() => setShowCatalog((v) => !v)}
                    className="text-[11px] text-cyan-400/80"
                  >
                    {showCatalog ? "Suggestions" : "Voir tout le catalogue"}
                  </button>
                )}
              </div>

              <div className="flex flex-col gap-3">
                {filteredExercises.map((ex) => (
                  <button
                    key={ex.id}
                    onClick={() => openExercise(ex)}
                    className="w-full text-left rounded-2xl p-4 transition-all active:scale-[0.98]"
                    style={{
                      background: "#0f1524",
                      border: `1px solid ${ex.color}18`,
                    }}
                  >
                    <div className="flex items-start gap-3.5">
                      <div
                        className="w-12 h-12 rounded-xl flex items-center justify-center text-2xl flex-shrink-0"
                        style={{ background: ex.color + "15" }}
                      >
                        {ex.emoji}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 mb-0.5">
                          <p className="text-white font-semibold text-[15px]">
                            {DEFINITIONS[ex.id] ? (
                              <Term defKey={ex.id}>{ex.name}</Term>
                            ) : (
                              ex.name
                            )}
                          </p>
                          <span
                            className="text-[10px] px-1.5 py-0.5 rounded-full font-medium"
                            style={{
                              background: ex.color + "15",
                              color: ex.color,
                            }}
                          >
                            {ex.level}
                          </span>
                        </div>
                        <p className="text-slate-400 text-xs leading-snug mb-2">
                          {ex.id === "coherence" ? (
                            <>
                              Équilibre &{" "}
                              <Term defKey="vfc">VFC</Term>
                            </>
                          ) : (
                            ex.subtitle
                          )}
                        </p>
                        <div className="flex flex-wrap gap-1.5">
                          {ex.tags.slice(0, 4).map((t) => (
                            <span key={t} className="text-[10px] text-slate-500">
                              {t === "#VFC" ? (
                                <Term defKey="vfc">#VFC</Term>
                              ) : (
                                t
                              )}
                            </span>
                          ))}
                        </div>
                        <div className="flex gap-3 mt-2 text-slate-600 text-[11px]">
                          <span>⏱ {ex.duration}</span>
                          <span>
                            <Term defKey="ratio" ratioLabel={formatRatio(ex.ratio)}>
                              {formatRatio(ex.ratio)}
                            </Term>
                          </span>
                        </div>
                      </div>
                      <span className="text-slate-600 text-lg self-center">›</span>
                    </div>
                  </button>
                ))}

                {filteredExercises.length === 0 && (
                  <p className="text-slate-500 text-sm text-center py-8">
                    Aucun exercice ne correspond à ces filtres
                  </p>
                )}
              </div>
            </div>
          </div>
          {/* fin du conteneur scrollable */}

          <BottomNav tab={tab} setTab={setTab} />
        </div>
      );
    }

    // ─── Barre de navigation inférieure ───
    function BottomNav({ tab, setTab }) {
      const items = [
        { id: "home", emoji: "🌬️", label: "Accueil" },
        { id: "journal", emoji: "📓", label: "Journal" },
      ];

      return (
        <div
          className="fixed bottom-0 left-0 right-0"
          style={{
            background: "#060a12",
            borderTop: "1px solid #141b2d",
          }}
        >
        <div className="max-w-[480px] mx-auto flex items-center justify-between px-5 py-3.5">
          {items.map((item) => {
            const active = tab === item.id;
            return (
              <button
                key={item.id}
                onClick={() => setTab(item.id)}
                className="flex flex-col items-center gap-0.5 transition-all active:scale-90"
              >
                <span className="text-xl">{item.emoji}</span>
                <span
                  className="text-[11px] font-medium"
                  style={{ color: active ? "#38bdf8" : "#475569" }}
                >
                  {item.label}
                </span>
              </button>
            );
          })}
        </div>
        </div>
      );
    }

    // ─── Rendu ───
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
